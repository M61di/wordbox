<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordbox">
<title>Wordbox</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#E9EEF5; --glass:rgba(233,238,245,.86); --surface:#FFFFFF; --ink:#14213D; --muted:#56627C; --line:#D3DAE7;
  --hi:rgba(255,222,64,.92); --accent:#14213D; --on-accent:#FFFFFF; --focus:#2563C9;
  --again:#C8432B; --hard:#9A6200; --good:#12806F; --easy:#2563C9;
  --shadow:0 1px 2px rgba(20,33,61,.08),0 10px 28px rgba(20,33,61,.10);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0C111D; --glass:rgba(12,17,29,.86); --surface:#161E32; --ink:#EDF0F8; --muted:#9AA6C0; --line:#2A3552;
    --hi:rgba(255,222,64,.30); --accent:#FFDE40; --on-accent:#14213D; --focus:#8FB4FF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--sans);min-height:100dvh;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;min-height:100dvh}
#view{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(104px + env(safe-area-inset-bottom))}
#view.in-session{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px;line-height:1.2}
p{margin:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.lead{font-size:19px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

/* the one signature element: a highlighter swipe behind the word */
.mark{background:linear-gradient(transparent 58%,var(--hi) 58% 93%,transparent 93%);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* buttons and fields */
.btn{appearance:none;-webkit-appearance:none;border:0;width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);font:600 17px/1 var(--sans);padding:0 20px;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--again);border:1.5px solid var(--again)}
.btn+.btn{margin-top:10px}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon:disabled{opacity:.3;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-weight:600;font-size:15px}
.opt{color:var(--muted);font-weight:400}
input,textarea,select{width:100%;font:16px/1.4 var(--sans);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px}
input,textarea{appearance:none;-webkit-appearance:none}
textarea{resize:vertical}
.help{color:var(--muted);font-size:15px;margin:6px 0 12px}
.divider{border:0;border-top:1px solid var(--line);margin:30px 0 24px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);z-index:10}
.tab{flex:1;background:none;border:0;color:var(--muted);font:600 12px/1 var(--sans);display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;cursor:pointer}
.tab .ico{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tab.on{color:var(--ink)}
.tab.on .ico{background:var(--hi)}

/* home */
.stack{position:relative;margin:28px 6px 36px}
.stack::before,.stack::after{content:"";position:absolute;inset:0;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.stack::before{transform:translateY(15px) scale(.93);opacity:.5}
.stack::after{transform:translateY(8px) scale(.965);opacity:.8}
.stack-card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:30px 22px 22px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.num{font:600 84px/1.05 var(--serif);margin-bottom:4px}
.stack-card .btn{margin-top:14px}
.stack-card h2{font-size:30px}
.progress h2{margin-bottom:12px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 10px;text-align:start}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:0;font:600 28px/1.2 var(--serif)}
.banner{background:var(--hi);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:18px}
.empty{display:flex;flex-direction:column;gap:12px;margin-top:26px}

/* study session */
.session{display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.card{flex:1;min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;cursor:pointer;-webkit-user-select:none;user-select:none}
.card.open{cursor:default}
.q{font:600 40px/1.3 var(--serif);overflow-wrap:anywhere}
.q.small{font:600 28px/1.4 var(--sans)}
.a{font:500 24px/1.45 var(--sans);overflow-wrap:anywhere}
.reveal{display:flex;flex-direction:column;align-items:center;gap:16px;animation:rise .18s ease-out}
.rule{width:56px;height:2px;border:0;background:var(--line);margin:0}
.note{color:var(--muted);font-size:16px;line-height:1.5}
.hint{color:var(--muted);font-size:15px}
.speak{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:0;border-radius:14px;min-height:66px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--sans);cursor:pointer}
.grade b{font-size:16px}
.grade small{font-size:12px;font-weight:500;opacity:.92}
.grade:active{transform:scale(.97)}
.g0{background:var(--again)}.g1{background:var(--hard)}.g2{background:var(--good)}.g3{background:var(--easy)}
.done{display:flex;flex-direction:column;gap:18px;padding-top:36px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid;border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font:600 26px/1.2 var(--serif)}
.tile span{font-size:13px;color:var(--muted)}
.tile.t0{border-top-color:var(--again)}.tile.t1{border-top-color:var(--hard)}.tile.t2{border-top-color:var(--good)}.tile.t3{border-top-color:var(--easy)}

/* library */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{width:100%;text-align:start;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.r-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.r-main>*{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main b{font:600 18px/1.3 var(--serif)}
.r-sub{color:var(--muted);font-size:15px}
.chip{flex:none;font:600 13px/1 var(--sans);padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.new{background:var(--hi);color:var(--ink);border-color:transparent}
.chip.due{background:var(--accent);color:var(--on-accent);border-color:transparent}
#q{margin-bottom:8px}
#count{margin:0 2px 10px;font-size:14px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(8,12,24,.5)}
.panel{position:relative;width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px/1.1 var(--sans);padding:11px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
body.lock{overflow:hidden}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font:600 15px/1.25 var(--sans);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86vw;z-index:30;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view"><p class="muted">Loading…</p></main>
  <nav id="tabs" class="tabs" aria-label="Main" hidden>
    <button class="tab on" data-act="tab" data-tab="study"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M6.5 4.5h11"/></svg></span><span>Study</span></button>
    <button class="tab" data-act="tab" data-tab="add"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Add</span></button>
    <button class="tab" data-act="tab" data-tab="library"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></span><span>Library</span></button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden>
  <div class="backdrop" data-act="closeSheet"></div>
  <div class="panel" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s).trim().toLowerCase();
const MIN = 6e4, HOUR = 36e5, DAY = 864e5;
const KEY = 'wordbox-data-v1';

const I = {
  close:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  undo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  speak:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>'
};

/* ---------- data ---------- */
const defaults = () => ({ cards: [], settings: { newPerDay: 10, voice: 'en-US', direction: 'forward' }, daily: { date: '', newDone: 0 } });
let db = defaults();
// Saves to the device. Uses Claude's storage when it exists, otherwise the browser's own storage.
const ls = (() => { try { const k = '__wb'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
const store = window.storage
  ? { get: k => window.storage.get(k), set: (k, v) => window.storage.set(k, v) }
  : ls
    ? { get: async k => { const v = ls.getItem(k); if (v === null) throw new Error('not found'); return { value: v }; },
        set: async (k, v) => { ls.setItem(k, v); return { value: v }; } }
    : null;
const storageOk = !!store;
let saveTimer;

async function load() {
  if (!storageOk) return;
  try {
    const r = await store.get(KEY);
    if (r && r.value) {
      const d = JSON.parse(r.value), def = defaults();
      db = {
        cards: Array.isArray(d.cards) ? d.cards : [],
        settings: { ...def.settings, ...d.settings },
        daily: { ...def.daily, ...d.daily }
      };
    }
  } catch (e) { /* nothing saved yet */ }
}
function save() {
  if (!storageOk) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await store.set(KEY, JSON.stringify(db)); }
    catch (e) { console.error(e); toast("Couldn't save. Export your words to be safe."); }
  }, 200);
}

const byId = id => db.cards.find(c => c.id === id);
const todayStr = () => new Date().toLocaleDateString('en-CA');
function newDoneToday() {
  if (db.daily.date !== todayStr()) db.daily = { date: todayStr(), newDone: 0 };
  return db.daily.newDone;
}
const makeCard = (front, back, note = '') => ({
  id: uid(), front: front.trim(), back: back.trim(), note: note.trim(),
  created: Date.now(), seen: false, due: 0, ease: 2.5, interval: 0, reps: 0, lapses: 0
});

/* ---------- scheduling (simplified SM-2, like Anki) ---------- */
function outcome(c, g) {
  // g: 0 Again, 1 Hard, 2 Good, 3 Easy
  let ease = c.ease;
  if (g === 0) {
    return { ease: c.reps > 0 ? Math.max(1.3, ease - 0.2) : ease, interval: 0, reps: 0, wait: 10 * MIN, lapse: c.reps > 0 };
  }
  let next;
  if (c.reps === 0) {
    next = [0, 1, 2, 5][g];
  } else {
    const hard = Math.max(1, Math.round(c.interval * 1.2));
    const good = Math.max(hard + 1, Math.round(c.interval * ease));
    const easy = Math.max(good + 1, Math.round(c.interval * ease * 1.3));
    next = [0, hard, good, easy][g];
  }
  if (g === 1) ease = Math.max(1.3, ease - 0.15);
  if (g === 3) ease = ease + 0.15;
  return { ease, interval: next, reps: c.reps + 1, wait: next * DAY, lapse: false };
}
function apply(c, g) {
  const o = outcome(c, g);
  c.ease = o.ease; c.interval = o.interval; c.reps = o.reps;
  c.due = Date.now() + o.wait; c.seen = true;
  if (o.lapse) c.lapses++;
}
function fmt(ms) {
  const m = ms / MIN;
  if (m < 60) return Math.max(1, Math.round(m)) + 'm';
  if (ms < DAY) return Math.round(ms / HOUR) + 'h';
  const d = ms / DAY;
  if (d < 30) return Math.round(d) + 'd';
  if (d < 365) return (Math.round(d / 30 * 10) / 10) + 'mo';
  return (Math.round(d / 365 * 10) / 10) + 'y';
}
function nextDue() {
  const now = Date.now();
  const f = db.cards.filter(c => c.seen && c.due > now).map(c => c.due);
  return f.length ? Math.min(...f) : null;
}
function status(c) {
  if (!c.seen) return ['New', 'new'];
  const w = c.due - Date.now();
  return w <= 0 ? ['Due', 'due'] : ['in ' + fmt(w), ''];
}

/* ---------- state ---------- */
let tab = 'study';
let session = null;
let editingId = null;

function startSession(extraNew) {
  const now = Date.now();
  const due = db.cards.filter(c => c.seen && c.due <= now).sort((a, b) => a.due - b.due);
  const room = Math.max(0, db.settings.newPerDay - newDoneToday()) + (extraNew || 0);
  const fresh = db.cards.filter(c => !c.seen).slice(0, room);
  const queue = [...due, ...fresh].map(c => c.id);
  if (!queue.length) return;
  session = { queue, revealed: false, graded: 0, counts: [0, 0, 0, 0], undo: null };
  render();
}
function grade(g) {
  if (!session || !session.queue.length) return;
  const id = session.queue[0], c = byId(id);
  if (!c) { session.queue.shift(); render(); return; }
  session.undo = { card: { ...c }, queue: [...session.queue], counts: [...session.counts], graded: session.graded, daily: { ...db.daily } };
  if (!c.seen) { newDoneToday(); db.daily.newDone++; }
  apply(c, g);
  session.queue.shift();
  if (g === 0) session.queue.push(id);
  session.counts[g]++; session.graded++; session.revealed = false;
  save(); render();
}
function undo() {
  if (!session || !session.undo) return;
  const s = session.undo, c = byId(s.card.id);
  if (c) Object.assign(c, s.card);
  session.queue = s.queue; session.counts = s.counts; session.graded = s.graded;
  db.daily = s.daily; session.undo = null; session.revealed = false;
  save(); render();
}

/* ---------- speech ---------- */
const canSpeak = () => 'speechSynthesis' in window && !!db.settings.voice;
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = db.settings.voice || 'en-US';
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { /* speech not available */ }
}
const speakBtn = text => canSpeak() ? `<button class="speak" data-act="speak" data-text="${esc(text)}" aria-label="Pronounce">${I.speak}</button>` : '';

/* ---------- views ---------- */
function viewHome() {
  const now = Date.now(), total = db.cards.length;
  const banner = storageOk ? '' : `<p class="banner">Saving isn't available here, so your words will be lost when you close this page. Export them from Library settings to keep a copy.</p>`;
  if (!total) {
    return `${banner}<h1>Wordbox</h1>
    <div class="empty">
      <p class="lead">No words yet.</p>
      <p class="muted">Add the words you want to remember. Wordbox shows each one again just before you'd forget it.</p>
      <button class="btn" data-act="goAdd">Add words</button>
      <button class="btn ghost" data-act="sample">Try 10 sample words</button>
    </div>`;
  }
  const dueN = db.cards.filter(c => c.seen && c.due <= now).length;
  const unseen = db.cards.filter(c => !c.seen).length;
  const newLeft = Math.min(unseen, Math.max(0, db.settings.newPerDay - newDoneToday()));
  const ready = dueN + newLeft;
  const known = db.cards.filter(c => c.seen && c.interval >= 21).length;
  const learning = db.cards.filter(c => c.seen && c.interval < 21).length;
  const pct = Math.round(known / total * 100);

  let hero;
  if (ready > 0) {
    const parts = [];
    if (dueN) parts.push(`${dueN} to review`);
    if (newLeft) parts.push(`${newLeft} new`);
    hero = `<div class="num"><span class="mark">${ready}</span></div>
      <p class="lead">${ready === 1 ? 'word is' : 'words are'} ready</p>
      <p class="muted">${parts.join(' and ')}</p>
      <button class="btn" data-act="start">Start studying</button>`;
  } else {
    const nd = nextDue();
    hero = `<h2>All caught up</h2>
      <p class="muted">${nd ? `The next word comes back in ${fmt(nd - now)}.` : 'Nothing is scheduled yet.'}</p>
      ${unseen ? `<button class="btn" data-act="startMore">Study ${Math.min(5, unseen)} new ${Math.min(5, unseen) === 1 ? 'word' : 'words'} early</button>` : ''}`;
  }
  return `${banner}<div class="head"><h1>Wordbox</h1></div>
    <section class="stack"><div class="stack-card">${hero}</div></section>
    <section class="progress">
      <h2>Your progress</h2>
      <div class="meter" role="img" aria-label="${pct} percent of words well known" style="margin-top:12px"><i style="width:${pct}%"></i></div>
      <dl class="facts">
        <div><dt>Words</dt><dd>${total}</dd></div>
        <div><dt>Learning</dt><dd>${learning}</dd></div>
        <div><dt>Well known</dt><dd>${known}</dd></div>
      </dl>
      <p class="muted" style="font-size:14px">A word is well known once you can wait 3 weeks or more before seeing it again.</p>
    </section>`;
}

function viewSession() {
  const s = session;
  if (!s.queue.length) return viewDone();
  const c = byId(s.queue[0]);
  const rev = db.settings.direction === 'reverse';
  const total = s.graded + s.queue.length;
  const pct = Math.round(s.graded / total * 100);
  const word = `<div class="q"><span class="mark" dir="auto">${esc(c.front)}</span></div>`;
  const meaning = `<div class="a" dir="auto">${esc(c.back)}</div>`;
  const note = c.note ? `<p class="note" dir="auto">${esc(c.note)}</p>` : '';
  let inner;
  if (!s.revealed) {
    inner = rev
      ? `<div class="q small" dir="auto">${esc(c.back)}</div><p class="hint">Tap to show the word</p>`
      : `${word}${speakBtn(c.front)}<p class="hint">Tap to show the meaning</p>`;
  } else {
    inner = rev
      ? `<div class="q small" dir="auto">${esc(c.back)}</div><hr class="rule"><div class="reveal">${word}${speakBtn(c.front)}${note}</div>`
      : `${word}${speakBtn(c.front)}<hr class="rule"><div class="reveal">${meaning}${note}</div>`;
  }
  const labels = ['Again', 'Hard', 'Good', 'Easy'];
  const actions = s.revealed
    ? `<div class="grades">${[0, 1, 2, 3].map(i => `<button class="grade g${i}" data-act="grade" data-g="${i}"><b>${labels[i]}</b><small>${fmt(outcome(c, i).wait)}</small></button>`).join('')}</div>`
    : `<button class="btn" data-act="reveal">Show answer</button>`;
  return `<div class="session">
    <div class="topbar">
      <button class="icon" data-act="exit" aria-label="End session">${I.close}</button>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <button class="icon" data-act="undo" aria-label="Undo last answer" ${s.undo ? '' : 'disabled'}>${I.undo}</button>
    </div>
    <div class="card ${s.revealed ? 'open' : ''}" ${s.revealed ? '' : 'data-act="reveal"'}>${inner}</div>
    ${actions}
  </div>`;
}

function viewDone() {
  const s = session, nd = nextDue(), names = ['Again', 'Hard', 'Good', 'Easy'];
  return `<div class="done">
    <h1>That's all for now</h1>
    <p class="lead">You answered ${s.graded} ${s.graded === 1 ? 'card' : 'cards'}.</p>
    <div class="tiles">${s.counts.map((n, i) => `<div class="tile t${i}"><b>${n}</b><span>${names[i]}</span></div>`).join('')}</div>
    ${nd ? `<p class="muted">The next word comes back in ${fmt(nd - Date.now())}.</p>` : ''}
    <button class="btn" data-act="finish">Back to home</button>
  </div>`;
}

function viewAdd() {
  return `<h1 style="margin-bottom:18px">Add words</h1>
    <div class="field"><label for="f-front">Word</label>
      <input id="f-front" dir="auto" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"></div>
    <div class="field"><label for="f-back">Meaning</label>
      <textarea id="f-back" dir="auto" rows="2"></textarea></div>
    <div class="field"><label for="f-note">Example or note <span class="opt">(optional)</span></label>
      <input id="f-note" dir="auto" autocomplete="off"></div>
    <button class="btn" data-act="addCard">Add word</button>
    <hr class="divider">
    <h2>Add many at once</h2>
    <p class="help">Paste one word per line. Separate the word from its meaning with a tab, a dash, an equals sign, or a semicolon. Text exported from Anki works too.</p>
    <div class="field"><textarea id="bulk" dir="auto" rows="7" placeholder="abandon - leave behind&#10;benefit; an advantage&#10;rare = not common"></textarea></div>
    <button class="btn ghost" data-act="importCards">Import words</button>`;
}

function viewLibrary() {
  const head = `<div class="head"><h1>Library</h1><button class="icon" data-act="settings" aria-label="Settings">${I.sliders}</button></div>`;
  if (!db.cards.length) {
    return `${head}<div class="empty"><p class="lead">Your library is empty.</p><button class="btn" data-act="goAdd">Add words</button></div>`;
  }
  return `${head}<input id="q" type="search" dir="auto" placeholder="Search words" autocomplete="off" autocapitalize="none" spellcheck="false">
    <p id="count" class="muted"></p><ul id="list" class="list"></ul>`;
}
function renderList() {
  const list = $('#list'); if (!list) return;
  const q = ($('#q').value || '').trim().toLowerCase();
  const items = [...db.cards].reverse().filter(c => !q || (c.front + ' ' + c.back + ' ' + c.note).toLowerCase().includes(q));
  $('#count').textContent = q ? `${items.length} of ${db.cards.length} words` : `${db.cards.length} ${db.cards.length === 1 ? 'word' : 'words'}`;
  list.innerHTML = items.length ? items.map(c => {
    const [label, cls] = status(c);
    return `<li><button class="row" data-act="edit" data-id="${c.id}">
      <span class="r-main"><b dir="auto">${esc(c.front)}</b><span class="r-sub" dir="auto">${esc(c.back)}</span></span>
      <span class="chip ${cls}">${label}</span></button></li>`;
  }).join('') : `<li class="muted" style="padding:14px 2px">No words match your search.</li>`;
}

/* ---------- render ---------- */
function render() {
  const v = $('#view');
  $('#tabs').hidden = !!session;
  v.classList.toggle('in-session', !!session);
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  if (session) v.innerHTML = viewSession();
  else if (tab === 'study') v.innerHTML = viewHome();
  else if (tab === 'add') v.innerHTML = viewAdd();
  else { v.innerHTML = viewLibrary(); renderList(); }
  window.scrollTo(0, 0);
}

/* ---------- sheet + toast ---------- */
function openSheet(html) { $('#sheet-body').innerHTML = html; $('#sheet').hidden = false; document.body.classList.add('lock'); }
function closeSheet() { $('#sheet').hidden = true; document.body.classList.remove('lock'); editingId = null; }
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function armed(btn, text) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3000);
  return false;
}

/* ---------- actions ---------- */
function addOne() {
  const f = $('#f-front').value.trim(), b = $('#f-back').value.trim(), n = $('#f-note').value.trim();
  if (!f) { toast('Enter the word first.'); $('#f-front').focus(); return; }
  if (!b) { toast('Enter the meaning.'); $('#f-back').focus(); return; }
  if (db.cards.some(c => norm(c.front) === norm(f))) { toast('That word is already in your library.'); return; }
  db.cards.push(makeCard(f, b, n)); save();
  $('#f-front').value = ''; $('#f-back').value = ''; $('#f-note').value = '';
  $('#f-front').focus(); toast('Added');
}
function parseLines(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    let parts = null, m;
    if (line.includes('\t')) parts = line.split('\t').map(s => s.trim());
    else if ((m = line.match(/^(.+?)\s+[-–—]\s+(.+)$/))) parts = [m[1], m[2]];
    else if ((m = line.match(/^(.+?)\s*[;=]\s*(.+)$/))) parts = [m[1], m[2]];
    else if ((m = line.match(/^(.+?)\s*,\s*(.+)$/))) parts = [m[1], m[2]];
    if (parts && parts[0] && parts[1]) out.push({ front: parts[0], back: parts[1], note: parts[2] || '' });
    else out.push(null);
  }
  return out;
}
function importBulk() {
  const ta = $('#bulk'), rows = parseLines(ta.value);
  if (!rows.length) { toast('Paste some words first.'); ta.focus(); return; }
  const seen = new Set(db.cards.map(c => norm(c.front)));
  let added = 0, skipped = 0;
  for (const r of rows) {
    if (!r || seen.has(norm(r.front))) { skipped++; continue; }
    seen.add(norm(r.front)); db.cards.push(makeCard(r.front, r.back, r.note)); added++;
  }
  save();
  if (added) ta.value = '';
  toast(added ? `Imported ${added} ${added === 1 ? 'word' : 'words'}${skipped ? `, skipped ${skipped}` : ''}` : `Nothing imported, skipped ${skipped}`);
}
function loadSample() {
  const words = [
    ['abandon', 'to leave behind or give up completely'], ['benefit', 'an advantage or a good result'],
    ['challenge', 'something difficult that tests you'], ['efficient', 'doing something well with little waste'],
    ['gradually', 'slowly, in small steps'], ['improve', 'to make or become better'],
    ['obvious', 'easy to see or understand'], ['purpose', 'the reason something is done'],
    ['reluctant', 'not willing, hesitant'], ['rare', 'not often found or seen']
  ];
  const have = new Set(db.cards.map(c => norm(c.front)));
  let n = 0;
  for (const [f, b] of words) if (!have.has(f)) { db.cards.push(makeCard(f, b)); n++; }
  save(); render(); toast(`Added ${n} sample words`);
}
function openEdit(id) {
  const c = byId(id); if (!c) return; editingId = id;
  const [label] = status(c);
  openSheet(`<div class="sheet-head"><h2>Edit word</h2><button class="icon" data-act="closeSheet" aria-label="Close">${I.close}</button></div>
    <div class="field"><label for="e-front">Word</label><input id="e-front" dir="auto" value="${esc(c.front)}" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="e-back">Meaning</label><textarea id="e-back" dir="auto" rows="2">${esc(c.back)}</textarea></div>
    <div class="field"><label for="e-note">Example or note</label><input id="e-note" dir="auto" value="${esc(c.note)}"></div>
    <p class="help">Status: ${label}. Reviewed ${c.reps} ${c.reps === 1 ? 'time' : 'times'} in a row, forgotten ${c.lapses} ${c.lapses === 1 ? 'time' : 'times'}.</p>
    <button class="btn" data-act="saveEdit">Save changes</button>
    <button class="btn ghost" data-act="resetCard">Reset progress</button>
    <button class="btn danger" data-act="deleteCard">Delete word</button>`);
}
function saveEdit() {
  const c = byId(editingId); if (!c) return;
  const f = $('#e-front').value.trim(), b = $('#e-back').value.trim(), n = $('#e-note').value.trim();
  if (!f || !b) { toast('A word needs both the word and its meaning.'); return; }
  if (db.cards.some(o => o.id !== c.id && norm(o.front) === norm(f))) { toast('Another word already uses that spelling.'); return; }
  c.front = f; c.back = b; c.note = n; save(); closeSheet(); renderList(); toast('Saved');
}
function settingsHTML() {
  const s = db.settings;
  const seg = (act, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
  const voices = [['', 'Off'], ['en-US', 'English (US)'], ['en-GB', 'English (UK)'], ['es-ES', 'Spanish'], ['fr-FR', 'French'], ['de-DE', 'German'], ['it-IT', 'Italian'], ['tr-TR', 'Turkish'], ['ar-SA', 'Arabic'], ['ja-JP', 'Japanese']];
  return `<div class="sheet-head"><h2>Settings</h2><button class="icon" data-act="closeSheet" aria-label="Close">${I.close}</button></div>
    <div class="field"><label>New words per day</label>${seg('setNew', [[5, '5'], [10, '10'], [20, '20'], [50, '50']], s.newPerDay)}</div>
    <div class="field"><label>Show first</label>${seg('setDir', [['forward', 'The word'], ['reverse', 'The meaning']], s.direction)}</div>
    <div class="field"><label for="voice">Pronunciation</label>
      <select id="voice">${voices.map(([v, l]) => `<option value="${v}" ${s.voice === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Your words</label><button class="btn ghost" data-act="export">Export words</button></div>
    <button class="btn danger" data-act="deleteAll">Delete all words</button>`;
}
function openExport() {
  const clean = s => String(s).replace(/[\t\r\n]+/g, ' ');
  const text = db.cards.map(c => [c.front, c.back, c.note].map(clean).filter((x, i) => i < 2 || x).join('\t')).join('\n');
  openSheet(`<div class="sheet-head"><h2>Export words</h2><button class="icon" data-act="closeSheet" aria-label="Close">${I.close}</button></div>
    <p class="help">One word per line, separated by tabs. Paste it back into Add words, or import it into Anki. Study progress isn't included.</p>
    <div class="field"><textarea id="export-text" rows="9" readonly>${esc(text)}</textarea></div>
    <button class="btn" data-act="copy">Copy to clipboard</button>`);
}
async function copyExport() {
  const ta = $('#export-text');
  try { await navigator.clipboard.writeText(ta.value); toast('Copied'); }
  catch (e) {
    ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    toast(ok ? 'Copied' : 'Text selected. Tap Copy in the menu.');
  }
}

/* ---------- events ---------- */
function handle(act, t) {
  switch (act) {
    case 'tab': tab = t.dataset.tab; render(); break;
    case 'goAdd': tab = 'add'; render(); break;
    case 'start': startSession(0); break;
    case 'startMore': startSession(5); break;
    case 'reveal': if (session) { session.revealed = true; render(); } break;
    case 'grade': grade(+t.dataset.g); break;
    case 'undo': undo(); break;
    case 'exit': case 'finish': session = null; render(); break;
    case 'speak': speak(t.dataset.text); break;
    case 'sample': loadSample(); break;
    case 'addCard': addOne(); break;
    case 'importCards': importBulk(); break;
    case 'edit': openEdit(t.dataset.id); break;
    case 'saveEdit': saveEdit(); break;
    case 'resetCard': {
      const c = byId(editingId); if (!c) break;
      Object.assign(c, { seen: false, due: 0, ease: 2.5, interval: 0, reps: 0, lapses: 0 });
      save(); closeSheet(); renderList(); toast('Progress reset'); break;
    }
    case 'deleteCard':
      if (!armed(t, 'Tap again to delete')) break;
      db.cards = db.cards.filter(c => c.id !== editingId);
      save(); closeSheet(); renderList(); toast('Deleted'); break;
    case 'settings': openSheet(settingsHTML()); break;
    case 'setNew': db.settings.newPerDay = +t.dataset.v; save(); $('#sheet-body').innerHTML = settingsHTML(); break;
    case 'setDir': db.settings.direction = t.dataset.v; save(); $('#sheet-body').innerHTML = settingsHTML(); break;
    case 'export': openExport(); break;
    case 'copy': copyExport(); break;
    case 'deleteAll':
      if (!armed(t, 'Tap again to delete everything')) break;
      db.cards = []; db.daily = { date: '', newDone: 0 }; save(); closeSheet(); render(); toast('Deleted'); break;
    case 'closeSheet': closeSheet(); break;
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t) handle(t.dataset.act, t);
});
document.addEventListener('input', e => { if (e.target.id === 'q') renderList(); });
document.addEventListener('change', e => {
  if (e.target.id === 'voice') { db.settings.voice = e.target.value; save(); toast('Saved'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  if (!session || !session.queue.length || !$('#sheet').hidden) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (!session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; render(); }
  else if (session.revealed && ['1', '2', '3', '4'].includes(e.key)) grade(+e.key - 1);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !session && tab === 'study' && $('#sheet').hidden) render();
});

/* ---------- home screen icon (drawn at runtime so no extra file is needed) ---------- */
(function icon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#14213D'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#FFDE40'; x.fillRect(24, 98, 132, 34);
    x.fillStyle = '#FFFFFF'; x.font = '700 94px ui-serif, Georgia, serif';
    x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText('Aa', 90, 128);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  } catch (e) { /* icon is optional */ }
})();

/* ---------- start ---------- */
load().then(render);
})();
</script>
</body>
</html>
